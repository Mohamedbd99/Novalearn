knp_paginator:
  page_range: 4 # Nombre de pages affichées dans la pagination
  default_options:
    page_name: page # Nom du paramètre GET pour la pagination (ex: ?page=2)
    sort_field_name: sort # Nom du paramètre GET pour le tri (ex: ?sort=title)
    sort_direction_name: direction # Nom du paramètre GET pour le sens du tri (ex: ?direction=asc)
  template:
    pagination: '@KnpPaginator/Pagination/bootstrap_v5_pagination.html.twig' # Utilisation de Bootstrap 5